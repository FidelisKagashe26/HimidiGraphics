# /etc/nginx/sites-available/himidgraphix.pro
# HTTPS blocks are added by `certbot --nginx` (see deploy/setup-server.sh).

upstream himidgraphix_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# www -> apex
server {
    listen 80;
    listen [::]:80;
    server_name www.himidgraphix.pro;

    # Let certbot answer its HTTP-01 challenge for www before redirecting.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://himidgraphix.pro$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name himidgraphix.pro;

    client_max_body_size 5m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml application/manifest+json;

    # Hashed build assets never change, so let browsers cache them for a year.
    location /_next/static/ {
        proxy_pass http://himidgraphix_app;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://himidgraphix_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
