# Himidi Graphics on himidgraphix.pro
# Installed as /etc/nginx/sites-available/himidgraphix.conf (symlinked into sites-enabled).
#
# ADDITIVE: its own server_name only, so it cannot affect the other sites
# sharing this host.
#
# Cloudflare origin cert for himidgraphix.pro + *.himidgraphix.pro.
# Cloudflare proxied, SSL mode Full (strict).
#
# Next.js server (systemd: himidgraphix-web.service) on 127.0.0.1:8101.
# GitHub Actions deploys a fresh release to /var/www/himidgraphix on every push to main.

upstream himidgraphix_app {
    server 127.0.0.1:8101;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name himidgraphix.pro www.himidgraphix.pro;
    return 301 https://himidgraphix.pro$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    listen [::]:443 ssl;
    server_name www.himidgraphix.pro;

    ssl_certificate     /etc/ssl/cloudflare/himidgraphix.pro.pem;
    ssl_certificate_key /etc/ssl/cloudflare/himidgraphix.pro.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://himidgraphix.pro$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    listen [::]:443 ssl;
    server_name himidgraphix.pro;

    ssl_certificate     /etc/ssl/cloudflare/himidgraphix.pro.pem;
    ssl_certificate_key /etc/ssl/cloudflare/himidgraphix.pro.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/himidgraphix.access.log;
    error_log  /var/log/nginx/himidgraphix.error.log;

    client_max_body_size 5m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml application/manifest+json;

    # Next.js puts a content hash in every file under /_next/static, so they
    # never change under the same URL and can be cached for good.
    location /_next/static/ {
        proxy_pass http://himidgraphix_app;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://himidgraphix_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }
}
